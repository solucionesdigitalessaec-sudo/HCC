name: APK Carrera Rentable

on:
  push:
    paths:
      - "carrera-rentable/**"
      - ".github/workflows/carrera-rentable-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carrera-rentable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Pruebas y compilación
        run: gradle :core:test :app:assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk carrera-rentable.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carrera-rentable-apk
          path: carrera-rentable/carrera-rentable.apk

      - name: Publicar en Releases (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carrera-rentable-ultima
          name: Carrera Rentable (última versión)
          prerelease: true
          body: "APK generado automáticamente desde el commit ${{ github.sha }}."
          files: carrera-rentable/carrera-rentable.apk
