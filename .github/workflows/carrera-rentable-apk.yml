name: APK KMRentable

on:
  push:
    paths:
      - "carrera-rentable/**"
      - ".github/workflows/carrera-rentable-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carrera-rentable
    env:
      VERSION: "1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Pruebas y compilación
        run: gradle :core:test :app:assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Nombrar APK con su versión
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kmrentable.apk
          cp app/build/outputs/apk/debug/app-debug.apk "kmrentable-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kmrentable-v${{ env.VERSION }}
          path: carrera-rentable/kmrentable-v${{ env.VERSION }}.apk

      # Una release por versión: así quedan guardadas todas las que se construyen.
      - name: Guardar esta versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kmrentable-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: KMRentable v${{ env.VERSION }}
          prerelease: true
          body: "Versión ${{ env.VERSION }} · commit ${{ github.sha }}: ${{ github.event.head_commit.message }}"
          files: carrera-rentable/kmrentable-v${{ env.VERSION }}.apk

      # Enlace fijo que siempre apunta a la última versión.
      - name: Actualizar "última versión"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kmrentable-ultima
          name: KMRentable (última versión)
          prerelease: true
          body: "Última versión: ${{ env.VERSION }} · commit ${{ github.sha }}."
          files: carrera-rentable/kmrentable.apk
